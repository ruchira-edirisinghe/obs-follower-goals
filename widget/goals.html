<!doctype html>
<!--
  obs-follower-goals widget: add this file to OBS as a Browser Source (Local file).
  It reads counts from the helper (server.py) and shows each platform as a goal: "436 / 500 · 64 to go".
  Every option is a URL parameter; see the README for the full list. Example:
    goals.html?layout=line&platforms=twitch,youtube&step=50
-->
<html lang="en"><head><meta charset="utf-8"><title>Follower Goals</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@600;700&display=swap">
<style>
:root{--ink:#4b2358;--accent:#ffe2bf;--text:#ffffff;--num:"Bungee";--scale:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
body{font-family:Rajdhani,system-ui,sans-serif;color:var(--text);padding:28px 18px 18px}
#root{display:inline-block;transform:scale(var(--scale));transform-origin:0 0}
.num{font-family:var(--num),Impact,sans-serif;font-variant-numeric:tabular-nums;line-height:1}
.ico{flex:none;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.ico svg{fill:#fff}
.plat{position:relative;display:flex;align-items:center}
.plat.off{display:none}
.plus{position:absolute;left:24px;top:-26px;font-size:24px;color:#a6ff94;opacity:0;pointer-events:none}
.plus.go{animation:plus 2.2s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.plat.hit .cnt,.plat.hit .goal{animation:hit .5s ease-in-out 4}
@keyframes hit{50%{transform:scale(1.14);filter:brightness(1.25)}}
.plat.win .goal{animation:win 1s ease-in-out 6}
@keyframes win{50%{color:#fff36e;transform:scale(1.2)}}

/* ----- layout: line (small, no background) ----- */
.line{display:flex;align-items:center;gap:26px}
.line .plat{gap:9px}
.line .ico{width:34px;height:34px}.line .ico svg{width:19px;height:19px}
.line .cnt{font-size:34px;padding-top:3px}
.line .goal{font-size:22px;padding-top:7px;color:var(--accent)}
.line .togo{display:none}

/* ----- layout: panel (glass card with a tab) ----- */
.panel{position:relative;display:flex;align-items:center;gap:34px;padding:22px 34px 16px;border-radius:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));border:3px solid rgba(255,255,255,.85);
  box-shadow:0 10px 30px rgba(60,20,80,.28),inset 0 1px 0 rgba(255,255,255,.6);backdrop-filter:blur(10px)}
.panel.noglass{background:none;border-color:transparent;box-shadow:none;backdrop-filter:none}
.tab{position:absolute;left:50%;top:-20px;transform:translateX(-50%);white-space:nowrap;font:700 20px Rajdhani;letter-spacing:.06em;
  padding:3px 20px;border-radius:99px;background:#fff;color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.panel .plat{gap:12px}
.panel .ico{width:48px;height:48px}.panel .ico svg{width:26px;height:26px}
.panel .txt{display:flex;flex-direction:column}
.panel .top{display:flex;align-items:baseline;gap:6px}
.panel .cnt{font-size:38px}
.panel .goal{font-size:24px;color:var(--accent)}
.panel .togo{font:700 16px Rajdhani;letter-spacing:.12em;text-transform:uppercase;margin-top:5px;padding:1px 10px;border-radius:99px;
  background:var(--ink);color:var(--accent);align-self:flex-start}
#status{position:fixed;left:10px;bottom:6px;font:600 13px Rajdhani;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px;display:none}
</style></head>
<body><div id="root"></div><div id="status"></div>
<script>
const q = new URLSearchParams(location.search);
const opt = (k, d) => q.has(k) ? q.get(k) : d;
const OPT = {
  layout: opt("layout", "panel"),                                   // panel | line
  platforms: opt("platforms", "facebook,twitch,tiktok,youtube").split(",").map(s => s.trim()).filter(Boolean),
  step: Math.max(1, +opt("step", 100)),                             // goal = next multiple of this
  server: opt("server", "http://127.0.0.1:8765").replace(/\/$/, ""),
  poll: Math.max(5, +opt("poll", 15)),                              // seconds
  title: opt("title", "Follower goals"),
  togo: opt("togo", "1") !== "0",
  glass: opt("glass", "1") !== "0",
  showEmpty: opt("showEmpty", "0") === "1",
  demo: opt("demo", "0") === "1",
};
const css = document.documentElement.style;
if (q.has("ink")) css.setProperty("--ink", "#" + q.get("ink").replace("#", ""));
if (q.has("accent")) css.setProperty("--accent", "#" + q.get("accent").replace("#", ""));
if (q.has("text")) css.setProperty("--text", "#" + q.get("text").replace("#", ""));
if (q.has("scale")) css.setProperty("--scale", +q.get("scale") || 1);
if (q.has("font")) {   // any Google Font, e.g. font=Titan+One, or a font installed on the PC
  const f = q.get("font"); css.setProperty("--num", `"${f}"`);
  document.getElementById("fontlink").href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(f).replace(/%20/g, "+")}&family=Rajdhani:wght@600;700&display=swap`;
}

const ICON = {
  twitch: "M5 2 3 6v14h5v3h3l3-3h4l4-4V2zm15 13-3 3h-4.5L9.8 20.7V18H6V4h14zM16 7h-2v6h2zm-5 0H9v6h2z",
  youtube: "M3.5 5.5C6 5 18 5 20.5 5.5c1 .3 1.6 1 1.8 2 .4 2.6.4 6.4 0 9-.2 1-.8 1.7-1.8 2-2.5.5-14.5.5-17 0-1-.3-1.6-1-1.8-2-.4-2.6-.4-6.4 0-9 .2-1 .8-1.7 1.8-2zM10 9v6l5.2-3z",
  tiktok: "M14 3h3c.3 2 1.6 3.4 3.6 3.6v3c-1.4 0-2.6-.4-3.6-1v6.6A5.8 5.8 0 1 1 11 9.5v3.1a2.8 2.8 0 1 0 3 2.8z",
  facebook: "M13.5 22v-8h2.8l.4-3.3h-3.2V8.6c0-.9.3-1.6 1.6-1.6h1.7V4.1A22 22 0 0 0 14.3 4c-2.5 0-4.1 1.5-4.1 4.2v2.5H7.4V14h2.8v8z",
};
const fmt = n => n.toLocaleString("en-US");
const goalFor = n => (Math.floor(n / OPT.step) + 1) * OPT.step;   // 127 -> 200, 200 -> 300

// thick outline for the numbers (text-shadow ring, works in OBS's browser)
function outline(el, w) {
  const s = [], n = 16, ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; s.push(`${(Math.cos(a) * w).toFixed(1)}px ${(Math.sin(a) * w).toFixed(1)}px 0 ${ink}`); }
  el.style.textShadow = s.join(",") + `,0 ${w + 2}px 0 ${ink}`;
}

// build
const root = document.getElementById("root");
const box = document.createElement("div");
box.className = OPT.layout === "line" ? "line" : "panel" + (OPT.glass ? "" : " noglass");
if (OPT.layout !== "line" && OPT.title) box.innerHTML = `<span class="tab"></span>`;
if (box.querySelector(".tab")) box.querySelector(".tab").textContent = OPT.title;
for (const k of OPT.platforms) {
  if (!ICON[k]) continue;
  const p = document.createElement("div"); p.className = "plat off"; p.id = "p_" + k;
  p.innerHTML = `<div class="ico"><svg viewBox="0 0 24 24"><path d="${ICON[k]}"/></svg></div>
    <div class="txt"><div class="top"><span class="num cnt">0</span><span class="num goal">/ ${OPT.step}</span></div><span class="togo"></span></div>
    <span class="num plus"></span>`;
  box.appendChild(p);
}
root.appendChild(box);
box.querySelectorAll(".cnt,.goal,.plus").forEach(el => outline(el, OPT.layout === "line" ? 2.5 : 3));

const shown = {};
function tween(el, from, to) {
  const t0 = performance.now(), d = 1200;
  const step = now => { const k = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setCount(k, n) {
  const p = document.getElementById("p_" + k); if (!p) return;
  const cnt = p.querySelector(".cnt"), goal = p.querySelector(".goal"), togo = p.querySelector(".togo"), plus = p.querySelector(".plus");
  p.classList.remove("off");
  const prev = shown[k];
  goal.textContent = "/ " + fmt(goalFor(n));
  togo.textContent = OPT.togo ? `${fmt(goalFor(n) - n)} to go` : "";
  togo.style.display = OPT.togo && OPT.layout !== "line" ? "" : "none";
  if (prev === undefined) { cnt.textContent = fmt(n); }
  else if (n !== prev) {
    tween(cnt, prev, n);
    if (n > prev) {
      plus.textContent = "+" + fmt(n - prev); plus.classList.remove("go"); void plus.offsetWidth; plus.classList.add("go");
      p.classList.remove("hit"); void p.offsetWidth; p.classList.add("hit");
      if (goalFor(prev) <= n) { p.classList.remove("win"); void p.offsetWidth; p.classList.add("win"); }   // crossed a goal
    }
  }
  shown[k] = n;
}
function hide(k) { const p = document.getElementById("p_" + k); if (p && !OPT.showEmpty) p.classList.add("off"); }

const status = document.getElementById("status");
async function poll() {
  try {
    const r = await fetch(OPT.server + "/counts", { cache: "no-store" });
    const d = await r.json();
    for (const k of OPT.platforms) {
      const v = d[k];
      if (v && v.count != null) setCount(k, v.count);
      else if (OPT.showEmpty) setCount(k, 0); else hide(k);
    }
    status.style.display = "none";
  } catch (e) {
    status.textContent = "follower goals: helper not running at " + OPT.server;   // only visible until the helper answers
    status.style.display = Object.keys(shown).length ? "none" : "block";
  }
}

if (OPT.demo) {   // fake numbers for previews and testing; a random platform gains followers every few seconds
  const demo = { facebook: 436, twitch: 97, tiktok: 1182, youtube: 381 };
  OPT.platforms.forEach(k => demo[k] != null && setCount(k, demo[k]));
  setInterval(() => { const k = OPT.platforms[Math.floor(Math.random() * OPT.platforms.length)]; if (demo[k] == null) return;
    demo[k] += 1 + Math.floor(Math.random() * 4); setCount(k, demo[k]); }, 4000);
} else { poll(); setInterval(poll, OPT.poll * 1000); }
</script>
</body></html>
